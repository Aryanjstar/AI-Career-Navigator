services:
  - type: web
    name: ai-career-navigator
    env: python
    region: oregon
    plan: free
    buildCommand: "pip install -r app/backend/requirements.txt"
    startCommand: "cd app/backend && gunicorn --bind=0.0.0.0:$PORT --workers=2 --threads=4 --timeout=300 --worker-class=gthread --access-logfile=- --error-logfile=- --log-level=info wsgi:application"
    envVars:
      - key: AZURE_OPENAI_ENDPOINT
        sync: false
      - key: AZURE_OPENAI_API_KEY
        sync: false
      - key: AZURE_OPENAI_CHATGPT_DEPLOYMENT
        value: gpt-35-turbo
      - key: AZURE_OPENAI_CHATGPT_MODEL
        value: gpt-35-turbo
      - key: AZURE_OPENAI_API_VERSION
        value: 2024-02-01
      - key: PYTHON_VERSION
        value: 3.11.0

